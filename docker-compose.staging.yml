version: '3.8'
services:
  backend:
    image: ${REGISTRY_HOST}/dental-app/backend:${BACKEND_TAG:-nightly}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - APP_ENV=production
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
    depends_on:
      - db
  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
  frontend:
    image: ${REGISTRY_HOST}/dental-app/frontend:${FRONTEND_TAG:-nightly}
    environment:
      - VITE_PORT=${VITE_PORT:-5173}
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  db_data:
