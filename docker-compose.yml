services:
  backend:
    build: 
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8810
    volumes:
      - ./backend:/app
    ports:
      - "8810:8810"
    environment:
      - DEBUG=1
      - SECRET_KEY=dev_secret_key
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1] backend
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=dental_db
      - SQL_USER=hello_django
      - SQL_PASSWORD=hello_django
      - SQL_HOST=db
      - SQL_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:5280,http://127.0.0.1:5280
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=hello_django
      - POSTGRES_PASSWORD=hello_django
      - POSTGRES_DB=dental_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5280:5280"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data: