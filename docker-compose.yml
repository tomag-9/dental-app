version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/dental_db
    volumes:
      - ./backend:/app
    working_dir: /app  # Explicitly set working directory
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=dental_db
    volumes:
      - db_data:/var/lib/postgresql/data
    stop_grace_period: 30s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_PORT=5173
    command: npm run dev -- --host 0.0.0.0
volumes:
  db_data: