components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_username:
          type: string
          readOnly: true
        lab:
          type: integer
          readOnly: true
          nullable: true
        lab_name:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        entity_type:
          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        metadata:
          readOnly: true
          nullable: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_username
      - created_at
