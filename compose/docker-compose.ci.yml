name: dental-app

services:
  backend:
    image: ${BACKEND_CI_IMAGE:-local/dental-backend-ci:latest}
    build:
      context: ../backend
    environment:
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost 127.0.0.1 [::1] backend}
      - SQL_ENGINE=${SQL_ENGINE:-django.db.backends.postgresql}
      - SQL_DATABASE=${SQL_DATABASE:-dental_db}
      - SQL_USER=${SQL_USER:-hello_django}
      - SQL_PASSWORD=${SQL_PASSWORD:-hello_django}
      - SQL_HOST=${SQL_HOST:-db}
      - SQL_PORT=${SQL_PORT:-5432}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5367,http://127.0.0.1:5367}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:5367,http://127.0.0.1:5367}
      # config/settings/dev.py adds http://localhost:$FRONTEND_PORT and
      # http://127.0.0.1:$FRONTEND_PORT to the trusted origins, so a stack on a
      # non-default port works without editing CSRF_TRUSTED_ORIGINS by hand.
      - FRONTEND_PORT=${FRONTEND_PORT:-5367}
      - BACKEND_PORT=${BACKEND_PORT:-8810}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hello_django}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hello_django}
      - POSTGRES_DB=${POSTGRES_DB:-dental_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hello_django} -d ${POSTGRES_DB:-dental_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: ${FRONTEND_CI_IMAGE:-local/dental-frontend-ci:latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://backend:8810/api}
    depends_on:
      db:
        condition: service_healthy
