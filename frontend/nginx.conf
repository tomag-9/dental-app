# Docker's embedded DNS at 127.0.0.11. A literal `proxy_pass http://backend:8000/...`
# resolves "backend" once, at config load, and nginx refuses to start at all if
# that name isn't resolvable yet — which happens on any restart where the
# frontend container comes up (or is recreated) before the backend container,
# not just on first boot. Routing through a variable forces per-request
# resolution via this resolver instead, so nginx starts regardless of backend's
# state and recovers automatically once it's reachable.
resolver 127.0.0.11 valid=10s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # No URI on proxy_pass here on purpose: nginx only does its usual
    # "replace the matched location prefix" rewrite when the proxy_pass
    # target is a literal string. With a variable (needed above for
    # per-request DNS resolution) that rewrite is disabled, and a URI here
    # would be used verbatim for every request regardless of path —
    # silently dropping everything after /api/. Omitting it forwards the
    # original request URI unchanged, which is what we want.
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
