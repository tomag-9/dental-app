name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  backend:
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt
      - name: Lint
        run: ./venv/bin/ruff check .
      - name: Run tests
        env:
          TESTING: '1'
          SECRET_KEY: 'test-key'
        run: ./venv/bin/python manage.py test

  frontend:
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_URL: http://localhost:8000/api
        run: npm run build

  docker:
    runs-on: [self-hosted, Linux, X64]
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t dental-app-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t dental-app-frontend:ci ./frontend
