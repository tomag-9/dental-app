name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  quality-check:
    runs-on: [self-hosted, Linux]
    name: Full Project Checks
    steps:
    - uses: actions/checkout@v4
    - name: Run checks
      run: ./check-all.sh
    - name: Cleanup Docker containers
      if: always()
      run: docker compose --env-file env/dev.env.example -f compose/docker-compose.yml down --remove-orphans

  docker-build:
    needs: [quality-check]
    runs-on: [self-hosted, Linux]
    if: github.event_name == 'push'
    name: Build Docker Images
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
    steps:
    - uses: actions/checkout@v4
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}
      if: env.DOCKER_USERNAME != '' && env.DOCKER_REGISTRY != ''
    - name: Build Backend Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: backend/Dockerfile
        push: false
        tags: local/dental-backend:latest
      if: env.DOCKER_USERNAME == '' || env.DOCKER_REGISTRY == ''
    - name: Build and Push Backend (with credentials)
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: backend/Dockerfile
        push: true
        tags: ${{ env.DOCKER_REGISTRY }}/dental-backend:latest
      if: env.DOCKER_USERNAME != '' && env.DOCKER_REGISTRY != ''
    - name: Build Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: frontend/Dockerfile
        push: false
        tags: local/dental-frontend:latest
      if: env.DOCKER_USERNAME == '' || env.DOCKER_REGISTRY == ''
    - name: Build and Push Frontend (with credentials)
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: frontend/Dockerfile
        push: true
        tags: ${{ env.DOCKER_REGISTRY }}/dental-frontend:latest
      if: env.DOCKER_USERNAME != '' && env.DOCKER_REGISTRY != ''
    - name: Cleanup Docker containers
      if: always()
      run: docker compose --env-file env/dev.env.example -f compose/docker-compose.yml down --remove-orphans
