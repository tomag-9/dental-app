name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
    # A release-please release PR only touches these — no application code
    # to test, so don't spin up the full backend/frontend/e2e pipeline for it.
    paths-ignore:
      - VERSION
      - frontend/package.json
      - CHANGELOG.md
      - .release-please-manifest.json

# Serialize runs per branch on the shared self-hosted runner so that the
# Docker container cleanup step in one run never kills containers owned by
# a concurrent run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Fast lint — no DB required, runs without deps
  # ──────────────────────────────────────────────
  lint:
    runs-on: [self-hosted]
    name: Lint
    env:
      COMPOSE_PROJECT_NAME: dental-app-ci-${{ github.run_id }}-${{ github.run_attempt }}-lint
      BACKEND_CI_IMAGE: local/dental-backend-ci:${{ github.run_id }}-${{ github.run_attempt }}-lint
    steps:
    - name: Prepare workspace
      run: |
        mkdir -p "$GITHUB_WORKSPACE"
        docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
        docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.20 sh -c 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
    - uses: actions/checkout@v4
      with:
        clean: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build backend image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        load: true
        tags: ${{ env.BACKEND_CI_IMAGE }}
        cache-from: type=gha,scope=dental-backend-ci
        cache-to: type=gha,scope=dental-backend-ci,mode=max
    - name: Run ruff
      run: |
        docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml \
          run --no-deps --rm backend \
          sh -c "ruff check apps && ruff format --check apps"
    - name: Cleanup
      if: always()
      run: |
        docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
        docker image rm "$BACKEND_CI_IMAGE" 2>/dev/null || true

  # ──────────────────────────────────────────────
  # Full test suite + coverage in a single run
  # (previously ran twice: once for tests, once for coverage)
  # ──────────────────────────────────────────────
  backend-tests:
    runs-on: [self-hosted]
    name: Backend Tests
    env:
      COMPOSE_PROJECT_NAME: dental-app-ci-${{ github.run_id }}-${{ github.run_attempt }}-backend
      BACKEND_CI_IMAGE: local/dental-backend-ci:${{ github.run_id }}-${{ github.run_attempt }}-backend
    steps:
    - name: Prepare workspace
      run: |
        mkdir -p "$GITHUB_WORKSPACE"
        docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
        docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.20 sh -c 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
    - uses: actions/checkout@v4
      with:
        clean: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build backend image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        load: true
        tags: ${{ env.BACKEND_CI_IMAGE }}
        cache-from: type=gha,scope=dental-backend-ci
        cache-to: type=gha,scope=dental-backend-ci,mode=max
    - name: Check for missing migrations
      run: docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml run --no-deps --rm backend python manage.py makemigrations --check --dry-run
    - name: Check OpenAPI schema baseline
      run: |
        docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml run --no-deps --rm backend \
          python manage.py generateschema > /tmp/openapi-current.yaml
        diff -u doc/openapi-baseline.yaml /tmp/openapi-current.yaml
    - name: Run tests with coverage
      run: |
        docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml run --rm backend \
          sh -c "coverage run --parallel-mode --rcfile=.coveragerc manage.py test --noinput --verbosity=2 --parallel \
            && coverage combine && coverage xml && coverage report --skip-covered --fail-under=80"
    - name: Cleanup
      if: always()
      run: |
        if [ -f env/dev.env.example ]; then
          docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml down -v --remove-orphans
        else
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
        fi
        docker image rm "$BACKEND_CI_IMAGE" 2>/dev/null || true

  # ──────────────────────────────────────────────
  # Frontend lint + build
  # ──────────────────────────────────────────────
  frontend-check:
    runs-on: [self-hosted]
    name: Frontend Tests & Lint
    env:
      COMPOSE_PROJECT_NAME: dental-app-ci-${{ github.run_id }}-${{ github.run_attempt }}-frontend
      FRONTEND_CI_IMAGE: local/dental-frontend-ci:${{ github.run_id }}-${{ github.run_attempt }}-frontend
    steps:
    - name: Prepare workspace
      run: |
        mkdir -p "$GITHUB_WORKSPACE"
        docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
        docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.20 sh -c 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
    - uses: actions/checkout@v4
      with:
        clean: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        target: dev
        load: true
        tags: ${{ env.FRONTEND_CI_IMAGE }}
        cache-from: type=gha,scope=dental-frontend-ci
        cache-to: type=gha,scope=dental-frontend-ci,mode=max
    - name: Run frontend lint
      run: docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml run --rm frontend npm run lint
    - name: Run frontend build
      run: docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml run --rm frontend npm run build
    # Static checks — no stack needed, so they run here rather than in the e2e
    # job. auth-smoke and permissions-smoke were deleted in #127 (redundant with
    # e2e/auth.spec.js and e2e/permissions.spec.js) and role-nav-smoke became
    # tests/unit/role-nav.test.mjs. visual-smoke stays out of CI on purpose: it
    # needs a running stack plus a browser and asserts nothing.
    - name: Run production-mock smoke check
      run: docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml run --rm --no-deps frontend npm run smoke:no-prod-mocks
    # Guards against .jsx files that no longer appear in main.js `appModules`
    # and are therefore never loaded into the build (#115).
    - name: Run orphan-module smoke check
      run: docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml run --rm --no-deps frontend npm run smoke:orphan-modules
    # Verifies the dental cross is driven by job data instead of the prototype
    # DEMO_STATE fixtures (#116).
    - name: Run tooth-chart data smoke check
      run: docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml run --rm --no-deps frontend npm run smoke:tooth-chart
    - name: Run frontend unit tests
      run: docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml run --rm --no-deps frontend npm run test:unit
    - name: Cleanup
      if: always()
      run: |
        if [ -f env/dev.env.example ]; then
          docker compose --env-file env/dev.env.example -f compose/docker-compose.ci.yml down -v --remove-orphans
        else
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
        fi
        docker image rm "$FRONTEND_CI_IMAGE" 2>/dev/null || true

  # ──────────────────────────────────────────────
  # Playwright end-to-end tests against a real stack
  # ──────────────────────────────────────────────
  e2e:
    needs: [backend-tests, frontend-check]
    runs-on: [self-hosted]
    name: E2E Tests
    # BACKEND_PORT/FRONTEND_PORT below are fixed host ports, so two concurrent
    # e2e jobs on this shared self-hosted runner would fight over them. This
    # group is deliberately NOT keyed on github.ref: it serialises e2e across
    # every branch. Everything else stays isolated per run through
    # COMPOSE_PROJECT_NAME, exactly like the other jobs.
    #
    # Since #123 the backend derives its CSRF trusted origins from FRONTEND_PORT
    # (it used to hardcode 5367), so picking free ports per run is now the only
    # thing standing between this job and full parallelism.
    concurrency:
      group: ${{ github.workflow }}-e2e-host-ports
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT_NAME: dental-app-ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e
      BACKEND_CI_IMAGE: local/dental-backend-ci:${{ github.run_id }}-${{ github.run_attempt }}-e2e
      FRONTEND_CI_IMAGE: local/dental-frontend-ci:${{ github.run_id }}-${{ github.run_attempt }}-e2e
      BACKEND_PORT: 8810
      FRONTEND_PORT: 5367
      VITE_API_URL: http://localhost:8810/api
      E2E_BASE_URL: http://localhost:5367
    steps:
    - name: Prepare workspace
      run: |
        mkdir -p "$GITHUB_WORKSPACE"
        docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
        docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.20 sh -c 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
    - uses: actions/checkout@v4
      with:
        clean: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build backend image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        load: true
        tags: ${{ env.BACKEND_CI_IMAGE }}
        cache-from: type=gha,scope=dental-backend-ci
        cache-to: type=gha,scope=dental-backend-ci,mode=max
    - name: Build frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        target: dev
        load: true
        tags: ${{ env.FRONTEND_CI_IMAGE }}
        cache-from: type=gha,scope=dental-frontend-ci
        cache-to: type=gha,scope=dental-frontend-ci,mode=max
    - name: Start stack
      run: |
        docker compose --env-file env/dev.env.example \
          -f compose/docker-compose.ci.yml -f compose/docker-compose.e2e.yml \
          up -d --force-recreate
    - name: Wait for backend health
      run: |
        for i in $(seq 1 90); do
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${BACKEND_PORT}/api/health/")" = "200" ]; then
            echo "backend healthy after ${i} attempt(s)"
            exit 0
          fi
          sleep 2
        done
        echo "::error::backend did not become healthy on port ${BACKEND_PORT}"
        docker compose --env-file env/dev.env.example \
          -f compose/docker-compose.ci.yml -f compose/docker-compose.e2e.yml logs backend
        exit 1
    - name: Wait for frontend dev server
      run: |
        for i in $(seq 1 90); do
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${FRONTEND_PORT}/")" = "200" ]; then
            echo "frontend serving after ${i} attempt(s)"
            exit 0
          fi
          sleep 2
        done
        echo "::error::frontend did not start on port ${FRONTEND_PORT}"
        docker compose --env-file env/dev.env.example \
          -f compose/docker-compose.ci.yml -f compose/docker-compose.e2e.yml logs frontend
        exit 1
    # The canonical seeder is the `seed_users` management command; `runscript`
    # is not available (django-extensions is not installed) and seed_data.py is
    # only a thin wrapper around the same command.
    - name: Seed demo data
      run: |
        docker compose --env-file env/dev.env.example \
          -f compose/docker-compose.ci.yml -f compose/docker-compose.e2e.yml \
          exec -T backend python manage.py seed_users
    - name: Install Playwright dependencies
      run: |
        PW_VERSION="$(sed -n 's/.*"@playwright\/test": *"[^0-9]*\([0-9.]*\)".*/\1/p' frontend/package.json)"
        if [ -z "$PW_VERSION" ]; then
          echo "::error::could not read the @playwright/test version from frontend/package.json"
          exit 1
        fi
        echo "PLAYWRIGHT_IMAGE=mcr.microsoft.com/playwright:v${PW_VERSION}-noble" >> "$GITHUB_ENV"
        docker run --rm -v "$GITHUB_WORKSPACE/frontend:/work" -w /work \
          "mcr.microsoft.com/playwright:v${PW_VERSION}-noble" npm ci
    # All 6 spec files gate the job. --workers=1 keeps the specs from racing each
    # other over shared lab data; the retry count comes from playwright.config.js
    # (1 when CI is set).
    - name: Run Playwright e2e tests
      run: |
        docker run --rm --network host \
          -v "$GITHUB_WORKSPACE/frontend:/work" -w /work \
          -e CI=1 -e E2E_BASE_URL \
          "$PLAYWRIGHT_IMAGE" \
          npx playwright test --workers=1 --reporter=list
    - name: Upload Playwright artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          frontend/test-results/
          frontend/playwright-report/
        if-no-files-found: ignore
        retention-days: 7
    - name: Dump stack logs on failure
      if: failure()
      run: |
        docker compose --env-file env/dev.env.example \
          -f compose/docker-compose.ci.yml -f compose/docker-compose.e2e.yml \
          logs --tail=200
    - name: Cleanup
      if: always()
      run: |
        if [ -f env/dev.env.example ]; then
          docker compose --env-file env/dev.env.example \
            -f compose/docker-compose.ci.yml -f compose/docker-compose.e2e.yml \
            down -v --remove-orphans
        else
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
        fi
        docker image rm "$BACKEND_CI_IMAGE" "$FRONTEND_CI_IMAGE" 2>/dev/null || true

  # ──────────────────────────────────────────────
  # Docker image build — only on push to main/develop
  # ──────────────────────────────────────────────
  docker-build:
    needs: [lint, backend-tests, frontend-check, e2e]
    runs-on: [self-hosted]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    name: Build Docker Images
    env:
      COMPOSE_PROJECT_NAME: dental-app-ci-${{ github.run_id }}-${{ github.run_attempt }}-images
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
    steps:
    - name: Prepare workspace
      run: |
        mkdir -p "$GITHUB_WORKSPACE"
        docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
        docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.20 sh -c 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
    - uses: actions/checkout@v4
      with:
        clean: false
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' && env.DOCKER_REGISTRY != ''
    - name: Build Backend Image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: backend/Dockerfile
        push: false
        tags: local/dental-backend:latest
      if: env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == '' || env.DOCKER_REGISTRY == ''
    - name: Build and Push Backend (with credentials)
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: backend/Dockerfile
        push: true
        tags: ${{ env.DOCKER_REGISTRY }}/dental-backend:latest
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' && env.DOCKER_REGISTRY != ''
    - name: Build Frontend Image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: frontend/Dockerfile
        push: false
        tags: local/dental-frontend:latest
      if: env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == '' || env.DOCKER_REGISTRY == ''
    - name: Build and Push Frontend (with credentials)
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: frontend/Dockerfile
        push: true
        tags: ${{ env.DOCKER_REGISTRY }}/dental-frontend:latest
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' && env.DOCKER_REGISTRY != ''
    - name: Cleanup
      if: always()
      run: docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
