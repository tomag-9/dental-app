name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  backend:
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Run tests
        env:
          TESTING: '1'
          SECRET_KEY: 'test-key'
        run: pytest

  frontend:
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_URL: http://localhost:8000/api
        run: npm run build

  docker:
    runs-on: [self-hosted, Linux, X64]
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t dental-app-backend:ci ./backend
          docker build -t dental-app-frontend:ci ./frontend
