name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    name: Backend Tests (Django)
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Run Backend Tests
      working-directory: backend
      run: |
        python manage.py test --verbosity=2
    - name: Test Results Summary
      if: always()
      run: |
        echo "Backend tests completed. Check logs above for results."

  frontend-test:
    runs-on: ubuntu-latest
    name: Frontend Tests & Build
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
    - name: Install Dependencies
      working-directory: frontend
      run: npm ci
    - name: Build Frontend
      working-directory: frontend
      run: npm run build
    - name: Check Linting (if available)
      working-directory: frontend
      run: |
        if grep -q '"lint"' package.json; then npm run lint; else echo "No lint script configured"; fi

  docker-build:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    name: Build Docker Images
    steps:
    - uses: actions/checkout@v3
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: secrets.DOCKER_USERNAME != ''
    - name: Build Backend Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: backend/Dockerfile
        push: false
        tags: local/dental-backend:latest
      if: secrets.DOCKER_USERNAME == ''
    - name: Build and Push Backend (with credentials)
      uses: docker/build-push-action@v4
      with:
        context: .
        file: backend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_REGISTRY }}/dental-backend:latest
      if: secrets.DOCKER_USERNAME != ''
    - name: Build Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: frontend/Dockerfile
        push: false
        tags: local/dental-frontend:latest
      if: secrets.DOCKER_USERNAME == ''
    - name: Build and Push Frontend (with credentials)
      uses: docker/build-push-action@v4
      with:
        context: .
        file: frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_REGISTRY }}/dental-frontend:latest
      if: secrets.DOCKER_USERNAME != ''
