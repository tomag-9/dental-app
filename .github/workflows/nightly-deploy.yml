name: Nightly Deploy

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC nightly
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_USER }}

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and push backend
        run: |
          docker build -f backend/Dockerfile -t $REGISTRY/dental-app/backend:nightly .
          docker push $REGISTRY/dental-app/backend:nightly

      - name: Build and push frontend
        run: |
          docker build -f frontend/Dockerfile -t $REGISTRY/dental-app/frontend:nightly .
          docker push $REGISTRY/dental-app/frontend:nightly

      - name: Deploy via SSH (LXC container direct)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/dental-app
            echo "Pulling images..."
            docker pull $REGISTRY/dental-app/backend:nightly
            docker pull $REGISTRY/dental-app/frontend:nightly
            echo "Bringing up services..."
            APP_ENV=production docker compose -f docker-compose.prod.yml --env-file /root/dental-app/.env.prod up -d --remove-orphans
            echo "Pruning old images..."
            docker image prune -f
            echo "Checking health..."
            sleep 3
            docker compose -f docker-compose.prod.yml ps
