name: Backend Django Tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/python-tests.yml'

jobs:
  test-backend:
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker compose --env-file env/dev.env.example -f compose/docker-compose.yml build backend

      - name: Run backend tests (Django)
        run: |
          docker compose --env-file env/dev.env.example -f compose/docker-compose.yml run --rm backend python manage.py test --noinput --verbosity=2

      - name: Cleanup Docker containers
        if: always()
        run: |
          docker compose --env-file env/dev.env.example -f compose/docker-compose.yml down --remove-orphans
